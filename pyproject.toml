[project]
name = "jlpt-lightning"
version = "0.1.0"
description = "A private, local JLPT vocabulary study companion"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2.13,<5.3", "django-htmx>=1.23,<2", "fsrs>=6.3,<7",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "waitress>=3.0.2,<4",
  "whitenoise>=6.9,<7", "tzdata>=2025.2",
]

[dependency-groups]
dev = ["ruff>=0.12", "pytest>=8.4", "pytest-django>=4.11", "pytest-playwright>=0.7"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lightning.settings"
testpaths = ["tests"]
markers = ["browser: requires Playwright Chromium", "corpus: validates the supplied workbooks"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".tools", ".runtime", ".conda", "staticfiles", "data/vocabulary", "pytest-cache-files-*"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
