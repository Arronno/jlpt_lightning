{% extends 'base.html' %}{% block title %}Library · JLPT Lightning{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">WORDS TO MAKE YOUR OWN</p><h1>Your vocabulary library</h1><p class="lede">Find a word, leave a note, or gather a collection.</p></div><a class="button" href="{% url 'collections' %}">My collections ↗</a></div>
<form class="filterbar" method="get" hx-get="{% url 'library' %}" hx-target="#library-results" hx-swap="outerHTML" hx-push-url="true"><label class="grow">Search<input type="search" name="q" value="{{ filters.q }}" placeholder="Japanese expression or English meaning"></label><label>Level<select name="level"><option value="">All levels</option>{% for n in '54321' %}<option value="{{ n }}" {% if filters.level|stringformat:'s' == n %}selected{% endif %}>N{{ n }}</option>{% endfor %}</select></label><label>Collection<select name="collection"><option value="">All words</option>{% for collection in collections %}<option value="{{ collection.pk }}" {% if filters.collection == collection.pk %}selected{% endif %}>{{ collection.name }}</option>{% endfor %}</select></label><label>Tag<input name="tag" value="{{ filters.tag }}" placeholder="e.g. travel"></label><label class="checkbox"><input type="checkbox" name="bookmarked" value="1" {% if filters.bookmarked %}checked{% endif %}> Bookmarked</label><button class="button primary">Find words</button></form>
{% include 'partials/library_results.html' %}{% endblock %}
